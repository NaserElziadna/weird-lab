name: omooma-ui-test
on:
  push:
    branches: [omooma-test]
    paths: ['app/**', 'test/**', '.github/workflows/omooma-test.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Report start
        run: |
          git config user.name "omooma-ci"
          git config user.email "omooma-ci@users.noreply.github.com"
          mkdir -p results && echo "run ${{ github.run_number }} started $(date -u)" > results/status.txt
          git add -f results/status.txt && git commit -q -m "Test started (run ${{ github.run_number }}) [skip ci]" && git push -q origin HEAD:omooma-test
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run UI test on Android 14 emulator
        id: emu
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: python3 test/ui_test.py
      - name: Save results to branch
        if: always()
        run: |
          mkdir -p results && echo "run ${{ github.run_number }} finished $(date -u), emulator step: ${{ steps.emu.outcome }}" > results/status.txt
          git add -f results
          git commit -q -m "Test results (run ${{ github.run_number }}) [skip ci]" || true
          for i in 1 2 3; do git pull -q --rebase origin omooma-test && git push -q origin HEAD:omooma-test && break; sleep 5; done
